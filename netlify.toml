[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# `npm run dev` runs `netlify dev`, which uses this to proxy the Next.js dev server
# and netlify/functions/* (ensure-auth-role, staff-*) on the same origin -- running
# `next dev` directly does NOT serve netlify/functions/*, which silently breaks the
# Firebase "role": "authenticated" custom-claim self-heal (see lib/AuthProvider.js)
# and all Staff Management actions.
[dev]
  command = "npm run dev:next-only"
  targetPort = 3000
  framework = "#custom"
